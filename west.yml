manifest:
  version: 1.2

  self:
    path: dev

  remotes:
    - name: zephyr_sdk
      url-base: https://github.com/zephyrproject-rtos

    - name: tmi
      url-base: https://github.com/trudellmedicalinternational

  projects:
    - name: zephyr
      remote: zephyr_sdk
      repo-path: zephyr
      revision: v4.4.1
      import:
        file: west.yml
        path-prefix: deps
        name-allowlist:
          - zephyr
          - cmsis_6
          - hal_nordic
          - hal_st

    # Drivers and bindings shared across TMI firmware. The sandbox samples
    # exercise these directly, so they are consumed from here rather than
    # copied in.
    - name: tmi_common_library
      remote: tmi
      repo-path: common-firmware-library
      revision: main
      path: deps/tmi
