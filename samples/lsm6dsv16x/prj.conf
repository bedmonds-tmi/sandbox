CONFIG_SHELL=y
CONFIG_LOG=y

CONFIG_I2C=y
CONFIG_I2C_SHELL=y

CONFIG_SENSOR=y
CONFIG_SENSOR_SHELL=y
CONFIG_SENSOR_SHELL_STREAM=y
CONFIG_SENSOR_INFO=y


# Read the INT1 line directly ("gpio get gpio@d8200 14") to tell a sensor that
# never asserts INT1 apart from an MCU that never sees the edge.
CONFIG_GPIO_SHELL=y

# lsm6dsv16x_config_drdy() and lsm6dsv16x_config_fifo() ignore every I2C return
# code, so a failed interrupt-route write is silent. Raise this to DBG to see
# the driver's LOG_DBG calls; at DBG the sensor shell logs one line per channel
# per frame, which at any real ODR floods the console and drops messages.
CONFIG_SENSOR_LOG_LEVEL_INF=y

# The sample owns the stream, so the shell's `sensor stream` would fight it for
# the driver's single streaming_sqe. i2c/gpio commands stay useful though.
#
# But the shell log backend redraws its prompt around every log line, wrapping
# each one in ~30 bytes of escapes that the plotter cannot parse -- and the
# synchronous redraw caps throughput near 17 lines/s. Log straight to the UART.
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_LOG_BACKEND_UART=y

# ~480 LOG_PRINTK lines/s. Immediate mode never drops a sample, which deferred
# mode does once the ring fills -- a dropped line is a gap in the plot.
CONFIG_LOG_MODE_IMMEDIATE=y

# process() holds three decode structs and emit() hands LOG_PRINTK 27 varargs,
# which cbprintf formats on the caller's stack in immediate mode. The default
# blew the main stack and faulted after the first FIFO frame.
CONFIG_MAIN_STACK_SIZE=4096
