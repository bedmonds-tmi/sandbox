CONFIG_LOG=y
CONFIG_TMI_DRIVER_TCS3400=y
CONFIG_TMI_DRIVER_TCS3400_TRIGGER_GLOBAL_THREAD=y

# The white illumination LED is driven by a PWM channel rather than a plain
# GPIO, so brightness can be swept against the sensor's response.
CONFIG_PWM=y

# The sample's runtime controls (gain, integration time, LED level) are
# exposed as shell commands.
CONFIG_SHELL=y
