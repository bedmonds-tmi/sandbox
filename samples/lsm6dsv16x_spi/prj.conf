CONFIG_SHELL=y
CONFIG_LOG=y

CONFIG_SPI=y
CONFIG_SPI_SHELL=y

CONFIG_SENSOR=y
CONFIG_SENSOR_SHELL=y
CONFIG_SENSOR_INFO=y

# Read the INT1 line directly ("gpio get gpio@d8200 15") to tell a sensor that
# never asserts INT1 apart from an MCU that never sees the edge. Also useful
# for driving CS by hand while checking the rework.
CONFIG_GPIO_SHELL=y

# Init's "chip id 0x.." line is LOG_INF, so a bus that is wired wrong shows up
# without raising the level. At DBG the sensor shell logs per channel per
# frame, which at this ODR floods the console.
CONFIG_SENSOR_LOG_LEVEL_INF=y

# FIFO streaming, not a data-ready interrupt per sample. DRDY costs five SPI
# transactions per sample here (status, all_int_src, the fetch, then status and
# all_int_src again to end the drain loop) which measured ~276us and caps out
# near 3600Hz -- fine for 3840Hz, not enough for 7680Hz's 130us budget. One
# watermark interrupt per 255 samples costs one 1785-byte burst instead.
#
# Streaming needs TRIGGER_NONE, not merely a trigger mode left unused.
# lsm6dsv16x_intr_callback() fires both paths when a trigger thread exists: it
# submits the work item AND calls lsm6dsv16x_stream_irq_handler() inline from
# ISR context. The work item then runs two blocking SPI reads while the stream
# handler is driving RTIO ops on the same bus. With TRIGGER_NONE neither the
# semaphore nor the work item is compiled in, lsm6dsv16x_handle_interrupt()
# vanishes entirely, and only the stream handler touches the bus.
#
# TMI_DRIVER_LSM6DSV16X_TRIGGER is still selected by STREAM, so the GPIO
# callback and init_interrupt() are present -- TRIGGER_NONE only removes the
# trigger-thread dispatch, not the interrupt itself.
CONFIG_TMI_DRIVER_LSM6DSV16X_TRIGGER_NONE=y

CONFIG_SENSOR_ASYNC_API=y

# The shell log backend redraws its prompt around every log line, wrapping each
# in ~30 bytes of escapes that the plotter cannot parse -- and the synchronous
# redraw caps throughput near 17 lines/s. Log straight to the UART.
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_LOG_BACKEND_UART=y

# Immediate mode never drops a line, which deferred mode does once the ring
# fills -- a dropped line is a gap in the plot.
CONFIG_LOG_MODE_IMMEDIATE=y

# process() holds three decode structs and the print hands LOG_PRINTK 18
# varargs, which cbprintf formats on the caller's stack in immediate mode.
CONFIG_MAIN_STACK_SIZE=4096
